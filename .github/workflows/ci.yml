# .github/workflows/ci.yml
name: TrackMyJob CI

# Trigger: run this pipeline on every push and pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # GitHub provides a fresh Ubuntu VM for every run

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Temurin = Eclipse Adoptium — the same JDK we use locally
          cache: maven
          # Caches Maven dependencies between runs — much faster builds

      # Step 3 — Build and run all tests
      - name: Build and Test
        run: mvn clean verify -B
        # clean  = fresh build (no cached .class files)
        # verify = compile + test + package
        # -B     = batch mode (no interactive prompts)

      # Step 4 — Upload test results (visible in GitHub Actions UI)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        # if: always() = upload even if tests fail (so we can see what broke)
        with:
          name: test-results
          path: target/surefire-reports/



