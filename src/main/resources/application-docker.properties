# DOCKER PROFILE — overrides for containerized deployment
# ----------------------------------------------------------------
# This file is loaded ONLY when the app runs with the "docker" profile.
# It overrides specific values from application.properties.
# Everything not overridden here comes from application.properties.

# Key difference: "postgres" instead of "localhost"
# Inside Docker, containers talk to each other by SERVICE NAME.
# "postgres" is the service name defined in docker-compose.yml.
# Docker's internal DNS resolves "postgres" to the container's IP.
spring.datasource.url=jdbc:postgresql://postgres:5432/trackmyjob_db

# In Docker we typically turn off SQL logging for cleaner output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false