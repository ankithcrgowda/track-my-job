# TEST PROFILE — used during unit and integration tests
# -------------------------------------------------------------------

# H2 in-memory database — created fresh for each test run
# MODE=PostgreSQL makes H2 behave like PostgreSQL (same SQL syntax)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates tables from entities, drops them after tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT config for tests
jwt.secret=dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9ydHJhY2tteWpvYmFwcGxpY2F0aW9u
jwt.expiration=86400000

# Disable open-in-view for tests
spring.jpa.open-in-view=false