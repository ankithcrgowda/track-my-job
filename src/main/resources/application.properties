spring.application.name=TrackMyJob

#SERVER PORT CONFIGURATION
# ------------------------------------------------------------------------
server.port=8080

# DATABASE CONFIGURATION
# This is the JDBC URL - it tells Spring exactly where PostgreSQL is.
# Format: jdbc:postgresql://HOST:PORT/DATABASE_NAME
# localhost = our Docker container (mapped to our machine on port 5432)
# trackmyjob_db = the database name we'll create in Docker
# ------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/trackmyjob_db
spring.datasource.username=trackmyjob_user
spring.datasource.password=trackmyjob_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/HIBARNATE CONFIGURATION
# hibernate.ddl-auto controls what Hibernate does to your DB schema on startup.
#
# Options explained:
#   none        → Hibernate does nothing. You manage the schema yourself.
#   validate    → Hibernate checks entities match the DB. Crashes if they don't.
#   update      → Hibernate alters existing tables to match entities. (RISKY in prod)
#   create      → Drops and recreates all tables every startup. (Lose all data!)
#   create-drop → Like create, but also drops tables when app shuts down.
#
# We use 'update' during development — it creates tables on first run,
# then only adds new columns if we add new fields. Safe for dev.
# In production, you would switch to 'validate' and use Flyway/Liquibase.
# --------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate we're using PostgreSQL so it generates the correct SQL dialect
# --------------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session in View pattern (best practice for REST APIs)
# For REST APIs we don't have "views" — we return JSON, not HTML templates.
# Keeping this enabled can cause lazy-loading to happen outside the service
# layer, which leads to subtle bugs and extra DB queries.
spring.jpa.open-in-view=false

# Prints every SQL statement Hibernate runs in the console.
# Extremely useful for learning and debugging. Turn off in production.
# --------------------------------------------------------------------------------------
spring.jpa.show-sql=true

# Formats the printed SQL so it's readable (not one long line)
# --------------------------------------------------------------------------------------
spring.jpa.properties.hibernate.format_sql=true

# JWT CONFIGURATION
# The secret key used to sign and verify JWT tokens.
# Think of this like the stamp on a hotel key card - only YOUR hotel's machine can verify it's genuine.
#
# IMPORTANT RULES:
# 1. This must be a Base64-encoded string, minimum 256 bits (32 bytes) for HS256
# 2. NEVER commit a real secret to GitHub — use environment variables in production
# 3. This value below is for development only
# --------------------------------------------------------------------------------------
jwt.secret=dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9ydHJhY2tteWpvYmFwcGxpY2F0aW9u
jwt.expiration=86400000
# 86400000 milliseconds = 24 hours
# This means: JWT tokens expire after 24 hours of being issued

# SPRINGDOC / SWAGGER CONFIGURATION
# Swagger UI will be available at: http://localhost:8080/swagger-ui.html
# --------------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs





